name = "hyacine-api"
main = "src/index.ts"
compatibility_date = "2026-08-24"

# 本地（wrangler dev --local）用占位 id；remote 部署前替换为真实 id，或直接用新方式：
#   方案 A（自动预置，wrangler>=4.45）：删掉下面两处 id/bucket 名，只留 binding 名，
#     wrangler deploy 会自动创建并回写 id；
#   方案 B（Dashboard）：Workers & Pages -> hyacine-api -> Bindings 页可视化添加绑定。
# 必须的 Secrets（CLI 或 Dashboard 均可）：
#   SETUP_CODE / AI_SUMMARY_ENDPOINT / AI_SUMMARY_KEY / AI_SUMMARY_MODEL / EMBED_MODEL
# 可选 Secrets（资产直传 R2 时才需要）：
#   R2_S3_ENDPOINT / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET
[[d1_databases]]
binding = "DB"
database_name = "hyacine"
database_id = "local"

[[kv_namespaces]]
binding = "CACHE"
id = "local"

# R2 上传为可选能力：不部署此绑定，/api/assets/presign 将返回 503(r2_not_configured)，
# 其余接口不受影响。需要资产直传 R2 时再取消注释并保留 bucket。
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "hyacine-assets"

[ai]
binding = "AI"
